spring:
  application:
    name: book-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/bookdb;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: always
mybatis:
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.example.bookmanagement: debug
  file:
    name: logs/book-management.log
app:
  security:
    admin-password: ${BOOK_ADMIN_PASSWORD:admin123}
    user-password: ${BOOK_USER_PASSWORD:user123}
    jwt-secret: ${JWT_SECRET:local-dev-only-book-management-jwt-signing-key-2026}
