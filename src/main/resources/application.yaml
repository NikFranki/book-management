spring:
  application:
    name: book-management
  datasource:
    url: jdbc:h2:file:./data/bookdb;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
logging:
  level:
    com.example.bookmanagement: debug
  file:
    name: logs/book-management.log
app:
  security:
    admin-password: ${BOOK_ADMIN_PASSWORD:admin123}
    user-password: ${BOOK_USER_PASSWORD:user123}
    jwt-secret: ${JWT_SECRET:local-dev-only-book-management-jwt-signing-key-2026}
